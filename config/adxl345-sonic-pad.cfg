# Configuración encontrada en el proyecto Ender AI con Debian/Klipper.
# Verifica el bus SPI y el cableado en tu propio equipo.

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 70
probe_points:
  117.5,117.5,10

# Pruebas habituales desde la consola de Klipper:
# ACCELEROMETER_QUERY
# MEASURE_AXES_NOISE
# SHAPER_CALIBRATE
# SAVE_CONFIG

# Las frecuencias y el tipo de shaper resultantes son exclusivos de cada
# impresora. No copies los valores de otra máquina.
